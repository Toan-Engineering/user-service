  name: user-service

  services:
    user-service:
      build:
        context: ../..
        dockerfile: .dockerfile
        target: deploy
        pull: true
        args:
          NODE_ENVIRONMENT: ${NODE_ENVIRONMENT:-development}
          PORT: ${PORT:-3000}
          DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

      image: user-service:local

      restart: unless-stopped
      init: true

      depends_on:
        user-service-db:
          condition: service_healthy
          restart: true

      ports:
        - "127.0.0.1:${PORT:-3000}:3000"

      environment:
        NODE_ENVIRONMENT: ${NODE_ENVIRONMENT:-development}
        PORT: ${PORT:-3000}
        DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

      read_only: true

      cap_drop:
        - ALL

      security_opt:
        - no-new-privileges:true

      tmpfs:
        - /tmp:rw,nosuid,nodev,size=64m

      stop_grace_period: 30s

      logging:
        driver: local
        options:
          max-size: "10m"
          max-file: "3"

      networks:
      - user-service-network


    user-service-db:
      image: postgres:18.6-alpine3.24

      restart: unless-stopped
      init: true

      ports:
        - "127.0.0.1:${DB_PORT:-5432}:5432"

      environment:
        POSTGRES_DB: ${POSTGRES_DB:-user-service}
        POSTGRES_USER: ${POSTGRES_USER:-root}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      healthcheck:
        test:
          [
            "CMD-SHELL",
            "pg_isready -U $${POSTGRES_USER:-root} -d $${POSTGRES_DB:-user-service}"
          ]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s

      stop_grace_period: 30s
      
      logging:
        driver: local
        options:
          max-size: "10m"
          max-file: "3"

      networks:
        - user-service-network

  networks:
    user-service-network:
      name: user-service-network
      driver: bridge

